name: V11 Materialize Apply
on:
  workflow_dispatch:
  push:
    branches: [v11-apply]
    paths:
      - 'tools/v11-parts/**'
      - 'tools/v11-manifest.json'
      - 'tools/v11-materialize.mjs'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-apply
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: node tools/v11-materialize.mjs
      - run: |
          git config user.name "v11-bot"
          git config user.email "bot@local"
          git add package.json lib/version.ts supabase/functions/weekly-plan tools
          if git diff --cached --quiet; then echo NO_CHANGE; else
            git commit -m "v11.0.0: materialize ORDER8D apply + version bump"
            git push origin v11-apply
          fi
