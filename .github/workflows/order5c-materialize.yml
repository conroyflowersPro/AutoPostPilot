name: ORDER5C materialize
on:
  push:
    branches: [order5c-everyday-hardening-v2]
    paths:
      - 'tools/order5c-*.patch*'
      - 'tools/order5c-materialize.mjs'
      - '.github/workflows/order5c-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order5c-everyday-hardening-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply ORDER5C patches
        run: node tools/order5c-materialize.mjs
      - name: Commit production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts supabase/functions/weekly-plan/everyday-language-reasoning.ts
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "ORDER5C: materialize hardened production index + everyday-language module"
            git push
          fi
