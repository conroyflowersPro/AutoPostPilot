name: ORDER1 materialize index.ts
on:
  workflow_dispatch:
  push:
    branches: [order1-seed-interpretation]
    paths:
      - "tools/order1-index.gz.b64"
      - "tools/order1-materialize-index.cjs"
      - ".github/workflows/order1-materialize-index.yml"
permissions:
  contents: write
concurrency:
  group: order1-materialize-index
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order1-seed-interpretation
          fetch-depth: 0
      - name: Materialize index.ts
        run: |
          set -euo pipefail
          if grep -q 'order1_seed_interpretation' supabase/functions/weekly-plan/index.ts; then
            echo "index already ORDER 1"
          else
            node tools/order1-materialize-index.cjs
          fi
          node tools/order1-seed-interpretation-test.mjs
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ORDER 1: materialize weekly-plan/index.ts seed interpretation wiring"
          git push origin HEAD:order1-seed-interpretation
