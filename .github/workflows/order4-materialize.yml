name: order4-materialize
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/order4-parts/**"
      - "tools/order4-materialize.cjs"
    branches: [order4-audience-reaction]
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/order4-materialize.cjs
      - run: |
          test -f supabase/functions/weekly-plan/audience-reaction-intelligence.ts
          grep -q ORDER4_VERSION supabase/functions/weekly-plan/audience-reaction-intelligence.ts
          ORDER4_ROOT=$PWD node tools/order4-audience-reaction-test.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ORDER4: materialize audience-reaction-intelligence.ts"
          file_pattern: supabase/functions/weekly-plan/audience-reaction-intelligence.ts

  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link and apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          # Try CLI link; password optional if already linked via token permissions
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$PROJECT_REF" || true
          fi
          # Execute migration SQL via db execute if available
          if supabase db --help 2>/dev/null | grep -q execute; then
            supabase db execute --file supabase/migrations/20260812_audience_reaction_intelligence_v1.sql || \
            supabase db execute -f supabase/migrations/20260812_audience_reaction_intelligence_v1.sql
          else
            # Fallback: psql via connection string secret
            if [ -n "${{ secrets.DATABASE_URL }}" ]; then
              export DATABASE_URL="${{ secrets.DATABASE_URL }}"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812_audience_reaction_intelligence_v1.sql
            else
              echo "Attempting management API with token (may 403 without DB scope)..."
              python3 <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          sql = open("supabase/migrations/20260812_audience_reaction_intelligence_v1.sql").read()
          for path in [
            f"https://api.supabase.com/v1/projects/{ref}/database/query",
            f"https://api.supabase.io/v1/projects/{ref}/database/query",
          ]:
            body = json.dumps({"query": sql}).encode()
            req = urllib.request.Request(path, data=body, method="POST", headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
            })
            try:
              with urllib.request.urlopen(req, timeout=120) as r:
                print("OK", path, r.status, r.read()[:500].decode())
                break
            except urllib.error.HTTPError as e:
              print("FAIL", path, e.code, e.read()[:500].decode())
          else:
              raise SystemExit("all apply paths failed — need SUPABASE_DB_PASSWORD or DATABASE_URL secret")
          PY
            fi
          fi
      - name: Verify schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, subprocess, shutil
          q = """
          SELECT table_name FROM information_schema.tables
          WHERE table_schema='public'
            AND table_name IN ('audience_reaction_records','audience_reaction_aggregates');
          """
          db = os.environ.get("DATABASE_URL") or ""
          if db and shutil.which("psql"):
            out = subprocess.check_output(["psql", db, "-t", "-A", "-c", q], text=True)
            print("PSQL", out)
            assert "audience_reaction_records" in out and "audience_reaction_aggregates" in out
            print("VERIFY_OK_PSQL")
            raise SystemExit(0)
          token = os.environ.get("SUPABASE_ACCESS_TOKEN","")
          ref = os.environ["PROJECT_REF"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          body = json.dumps({"query": q}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
            "Authorization": f"Bearer {token}", "Content-Type": "application/json",
          })
          try:
            with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read().decode()
              print(data)
              assert "audience_reaction_records" in data
              print("VERIFY_OK_API")
          except urllib.error.HTTPError as e:
              print("VERIFY_API", e.code, e.read()[:800].decode())
              raise SystemExit("verify failed — schema apply may have failed; need DB password")
          PY
