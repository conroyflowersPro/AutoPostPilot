name: order4-materialize
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/order4-parts/**"
      - "tools/order4-materialize.cjs"
    branches: [order4-audience-reaction]
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/order4-materialize.cjs
      - run: |
          test -f supabase/functions/weekly-plan/audience-reaction-intelligence.ts
          grep -q ORDER4_VERSION supabase/functions/weekly-plan/audience-reaction-intelligence.ts
          grep -q analyzePublishedPostAudience supabase/functions/weekly-plan/audience-reaction-intelligence.ts
          ORDER4_ROOT=$PWD node tools/order4-audience-reaction-test.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ORDER4: materialize audience-reaction-intelligence.ts"
          file_pattern: supabase/functions/weekly-plan/audience-reaction-intelligence.ts

  apply-migration:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify ORDER4 migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          test -f supabase/migrations/20260812_audience_reaction_intelligence_v1.sql
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"

          def run(q):
              body = json.dumps({"query": q}).encode()
              req = urllib.request.Request(url, data=body, method="POST", headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          sql = open("supabase/migrations/20260812_audience_reaction_intelligence_v1.sql").read()
          code, out = run(sql)
          print("APPLY", code, out[:1500])
          if code >= 400:
              raise SystemExit(f"apply failed: {code}")

          code, tables = run("""
          SELECT table_name FROM information_schema.tables
          WHERE table_schema='public'
            AND table_name IN ('audience_reaction_records','audience_reaction_aggregates')
          ORDER BY 1;
          """)
          print("TABLES", tables)
          assert "audience_reaction_records" in tables and "audience_reaction_aggregates" in tables

          code, cols = run("""
          SELECT column_name FROM information_schema.columns
          WHERE table_schema='public' AND table_name='audience_reaction_records'
          ORDER BY ordinal_position;
          """)
          print("RECORD_COLS", cols)
          for need in ["published_post_id","published_origin","audience_evidence_status",
                       "reader_behavior_distribution","performance_context","analyzed_at"]:
              assert need in cols, need

          code, agg = run("""
          SELECT column_name, column_default FROM information_schema.columns
          WHERE table_schema='public' AND table_name='audience_reaction_aggregates'
          ORDER BY ordinal_position;
          """)
          print("AGG_COLS", agg)
          assert "contains_raw_comment_examples" in agg

          code, idx = run("""
          SELECT indexname FROM pg_indexes WHERE schemaname='public'
            AND tablename IN ('audience_reaction_records','audience_reaction_aggregates');
          """)
          print("IDX", idx)
          for need in ["audience_reaction_records_post_id_idx",
                       "audience_reaction_records_analyzed_at_idx",
                       "audience_reaction_records_origin_idx",
                       "audience_reaction_aggregates_updated_at_idx"]:
              assert need in idx, need

          code, raw = run("""
          SELECT column_name FROM information_schema.columns
          WHERE table_schema='public'
            AND table_name IN ('audience_reaction_records','audience_reaction_aggregates')
            AND (column_name ILIKE '%raw%comment%' OR column_name ILIKE '%reply_text%');
          """)
          print("RAW_BOUNDARY", raw)
          assert "raw_comment" not in raw.lower()

          # smoke insert + cleanup
          code, ins = run("""
          INSERT INTO public.audience_reaction_records (
            published_post_id, published_origin, audience_evidence_status,
            reply_count_analyzed, meaningful_reply_count,
            reader_behavior_distribution, dominant_reader_behaviors,
            self_projection_evidence, order4_version
          ) VALUES (
            'SMOKE_ORDER4_DELETE_ME', 'MANUAL_PUBLISHED', 'ANALYZED',
            1, 1, '{"PERSONAL_STORY":1}'::jsonb, '["PERSONAL_STORY"]'::jsonb,
            '{}'::jsonb, 'order4_audience_reaction_v1'
          ) RETURNING published_post_id;
          """)
          print("INS", ins)
          assert "SMOKE_ORDER4_DELETE_ME" in ins

          code, ins2 = run("""
          INSERT INTO public.audience_reaction_aggregates (
            aggregate_id, posts_analyzed, contains_raw_comment_examples, order4_version
          ) VALUES ('SMOKE_AGG_ORDER4_DELETE_ME', 1, false, 'order4_audience_reaction_v1')
          RETURNING aggregate_id, contains_raw_comment_examples;
          """)
          print("INS2", ins2)
          assert "false" in ins2.lower()

          run("DELETE FROM public.audience_reaction_records WHERE published_post_id='SMOKE_ORDER4_DELETE_ME';")
          run("DELETE FROM public.audience_reaction_aggregates WHERE aggregate_id='SMOKE_AGG_ORDER4_DELETE_ME';")
          print("ORDER4_MIGRATION_VERIFY_OK")
          PY
