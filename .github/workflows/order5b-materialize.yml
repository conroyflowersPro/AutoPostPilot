name: ORDER5B materialize
on:
  push:
    branches: [order5b-everyday-pipeline]
    paths:
      - "tools/order5b-parts/**"
      - "tools/order5b-mod-parts/**"
      - "tools/order5b-manifest.json"
      - "tools/order5b-mod-manifest.json"
      - "tools/order5b-materialize.mjs"
  workflow_dispatch: {}
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/order5b-materialize.mjs
      - name: Verify markers
        run: |
          grep -q decideEverydayLanguage supabase/functions/weekly-plan/index.ts
          grep -q phased_v10_order5b_everyday_language supabase/functions/weekly-plan/index.ts
          grep -q 10.0.0-order5b supabase/functions/weekly-plan/index.ts
          grep -q selectThinkingRail supabase/functions/weekly-plan/index.ts
          grep -q ORDER5B_VERSION supabase/functions/weekly-plan/everyday-language-reasoning.ts
          test $(wc -c < supabase/functions/weekly-plan/index.ts) -eq 36244
          test $(wc -c < supabase/functions/weekly-plan/everyday-language-reasoning.ts) -eq 21750
      - name: Run tests
        run: |
          if [ -f tools/order5b-everyday-pipeline-test.mjs ]; then ORDER5B_ROOT=$PWD node tools/order5b-everyday-pipeline-test.mjs; else echo "test file pending"; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts supabase/functions/weekly-plan/everyday-language-reasoning.ts
          if git diff --cached --quiet; then echo nochange; else git commit -m "ORDER5B: materialize production index + everyday-language module" && git push; fi
