name: ORDER6B materialize index
on:
  push:
    branches: [order6b-contextual-style-humor]
    paths:
      - "tools/order6b-index.patch"
      - "tools/order6b-materialize.mjs"
      - ".github/workflows/order6b-materialize.yml"
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order6b-contextual-style-humor
      - name: Apply index patch
        run: |
          set -e
          if grep -q 'decideNaturalHumor' supabase/functions/weekly-plan/index.ts; then
            echo "already materialized"
          else
            patch -p1 --forward < tools/order6b-index.patch
          fi
          grep -n 'decideNaturalHumor\|10.0.0-order6b\|order6b_contextual' supabase/functions/weekly-plan/index.ts | head
          wc -c supabase/functions/weekly-plan/index.ts
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/weekly-plan/index.ts || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "ORDER6B: materialize index wiring (style contextual + natural humor)"
            git push
          fi
