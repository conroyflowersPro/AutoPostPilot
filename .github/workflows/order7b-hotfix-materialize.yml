name: ORDER7B HOTFIX materialize
on:
  push:
    branches: [order7b-hotfix-live-xai-writer]
    paths:
      - "tools/order7b-hotfix-index.patch"
      - ".github/workflows/order7b-hotfix-materialize.yml"
      - "supabase/functions/weekly-plan/independent-post-generation.ts"
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order7b-hotfix-live-xai-writer
          fetch-depth: 0
      - name: Apply index patch and commit
        run: |
          set -euo pipefail
          test -f supabase/functions/weekly-plan/independent-post-generation.ts
          test -f tools/order7b-hotfix-index.patch
          if grep -q 'await generateIndependentPost' supabase/functions/weekly-plan/index.ts; then
            echo index_already_wired
          else
            patch -p1 --forward < tools/order7b-hotfix-index.patch
          fi
          grep -n 'await generateIndependentPost\|async function compactSlot\|dry_run_generation\|hotfix-live-xai' supabase/functions/weekly-plan/index.ts | head -20
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/weekly-plan/index.ts || true
          if git diff --cached --quiet; then echo no_index_changes; else
            git commit -m "ORDER7B HOTFIX: materialize live xAI writer wiring in index.ts"
            git push
          fi
      - name: Tests
        run: |
          ORDER7B_MOD=supabase/functions/weekly-plan/independent-post-generation.ts \
          ORDER7B_INDEX=supabase/functions/weekly-plan/index.ts \
            node tools/order7b-hotfix-live-xai-test.mjs
          ORDER7B_MOD=supabase/functions/weekly-plan/independent-post-generation.ts \
          ORDER7A_MOD=supabase/functions/weekly-plan/deep-generation-context.ts \
          ORDER7B_INDEX=supabase/functions/weekly-plan/index.ts \
            node tools/order7b-independent-generation-test.mjs
