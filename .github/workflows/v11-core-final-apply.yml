name: V11 CORE Final Direct Apply
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble final CORE parts and verify SHA
        run: node tools/v11-core-final-parts/assemble-and-apply.mjs
      - name: Show markers
        run: |
          wc -c supabase/functions/weekly-plan/index.ts supabase/functions/weekly-plan/independent-post-generation.ts supabase/functions/weekly-plan/semantic-judge.ts
          sha256sum supabase/functions/weekly-plan/index.ts supabase/functions/weekly-plan/independent-post-generation.ts supabase/functions/weekly-plan/semantic-judge.ts
          grep -n "phased_v11_order8d_apply\|WEEKLY_ENGINE_VERSION\|APP_VERSION = " supabase/functions/weekly-plan/index.ts | head -15
      - name: Commit applied CORE files
        run: |
          git config user.name "conroyflowersPro"
          git config user.email "conroyf12@gmail.com"
          git add supabase/functions/weekly-plan/index.ts supabase/functions/weekly-plan/independent-post-generation.ts supabase/functions/weekly-plan/semantic-judge.ts
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit (already applied)"
          else
            git commit -m "v11.0.0 CORE: apply final ORDER8D index + independent + semantic-judge"
            git push origin main
          fi
