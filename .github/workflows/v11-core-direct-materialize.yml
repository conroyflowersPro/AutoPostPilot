name: v11 CORE direct materialize
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/v11-core-direct/**'
      - 'tools/v11-core-direct-materialize.mjs'
      - '.github/workflows/v11-core-direct-materialize.yml'
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble CORE index + modules
        run: node tools/v11-core-direct-materialize.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts \
            supabase/functions/weekly-plan/independent-post-generation.ts \
            supabase/functions/weekly-plan/semantic-judge.ts \
            supabase/functions/weekly-plan/seed-supply-expansion.ts || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v11.0.0 CORE: materialize full weekly-plan index (phased_v11_order8d_apply) + modules"
            git push
          fi
