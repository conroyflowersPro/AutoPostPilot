name: order7c-materialize
on:
  push:
    branches: [order7c-generation-integration-hardening]
    paths:
      - 'tools/order7c-wire-index.mjs'
      - '.github/workflows/order7c-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order7c-generation-integration-hardening
          fetch-depth: 1
      - name: Wire ORDER 7C into index.ts
        run: |
          node tools/order7c-wire-index.mjs
          grep -q integrateSlotGeneration supabase/functions/weekly-plan/index.ts
          grep -q completion_gate_final supabase/functions/weekly-plan/index.ts
          grep -q ORDER7C_VERSION supabase/functions/weekly-plan/index.ts
          wc -c supabase/functions/weekly-plan/index.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "ORDER7C: materialize generation integration wiring in index.ts"
            git push
          fi
