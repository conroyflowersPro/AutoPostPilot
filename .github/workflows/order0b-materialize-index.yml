name: ORDER0B materialize index.ts
on:
  workflow_dispatch:
  push:
    branches: [order0b-manual-leakage]
    paths:
      - "tools/order0b-index.gz.b64"
      - "tools/order0b-materialize-index.cjs"
      - ".github/workflows/order0b-materialize-index.yml"
permissions:
  contents: write
concurrency:
  group: order0b-materialize-index
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: order0b-manual-leakage
          fetch-depth: 0
      - name: Materialize index.ts from gz.b64
        run: |
          set -euo pipefail
          node tools/order0b-materialize-index.cjs
          node tools/order0b-manual-leakage-test.mjs
      - name: Commit and push index.ts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/weekly-plan/index.ts
          if git diff --staged --quiet; then
            echo "No index.ts changes to commit"
            exit 0
          fi
          git commit -m "ORDER 0B: materialize weekly-plan/index.ts from order0b-index.gz.b64"
          git push origin HEAD:order0b-manual-leakage
