name: order4-apply-migration
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply ORDER4 migration via Management API SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          SQL_FILE=supabase/migrations/20260812_audience_reaction_intelligence_v1.sql
          test -f "$SQL_FILE"
          # Encode SQL as JSON string for query endpoint
          python3 - <<'PY'
          import json, os, urllib.request
          sql = open("supabase/migrations/20260812_audience_reaction_intelligence_v1.sql").read()
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          # Prefer database query via Management API
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          body = json.dumps({"query": sql}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json",
          })
          try:
            with urllib.request.urlopen(req, timeout=120) as r:
              print("APPLY_STATUS", r.status)
              print(r.read()[:2000].decode())
          except urllib.error.HTTPError as e:
            print("HTTP", e.code, e.read()[:2000].decode())
            raise
          PY
      - name: Verify tables exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          q = """
          SELECT table_name
          FROM information_schema.tables
          WHERE table_schema='public'
            AND table_name IN ('audience_reaction_records','audience_reaction_aggregates')
          ORDER BY table_name;
          """
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          body = json.dumps({"query": q}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json",
          })
          with urllib.request.urlopen(req, timeout=60) as r:
            data = r.read().decode()
            print(data)
            assert "audience_reaction_records" in data
            assert "audience_reaction_aggregates" in data
            print("TABLES_OK")
          PY
      - name: Verify columns indexes defaults
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          def run(q):
            body = json.dumps({"query": q}).encode()
            req = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
            })
            with urllib.request.urlopen(req, timeout=60) as r:
              return r.read().decode()
          cols = run("""
          SELECT column_name, data_type, column_default, is_nullable
          FROM information_schema.columns
          WHERE table_schema='public' AND table_name='audience_reaction_records'
          ORDER BY ordinal_position;
          """)
          print("RECORDS_COLS", cols[:3000])
          for need in ["published_post_id","published_origin","audience_evidence_status",
                       "reader_behavior_distribution","performance_context","analyzed_at"]:
            assert need in cols, need
          agg = run("""
          SELECT column_name, data_type, column_default, is_nullable
          FROM information_schema.columns
          WHERE table_schema='public' AND table_name='audience_reaction_aggregates'
          ORDER BY ordinal_position;
          """)
          print("AGG_COLS", agg[:3000])
          assert "contains_raw_comment_examples" in agg
          assert "false" in agg.lower() or "DEFAULT false" in agg or "default false" in agg.lower()
          idx = run("""
          SELECT indexname FROM pg_indexes
          WHERE schemaname='public'
            AND tablename IN ('audience_reaction_records','audience_reaction_aggregates')
          ORDER BY indexname;
          """)
          print("INDEXES", idx)
          for need in ["audience_reaction_records_post_id_idx",
                       "audience_reaction_records_analyzed_at_idx",
                       "audience_reaction_records_origin_idx",
                       "audience_reaction_aggregates_updated_at_idx"]:
            assert need in idx, need
          # raw text boundary: no raw_comment column
          raw = run("""
          SELECT column_name FROM information_schema.columns
          WHERE table_schema='public'
            AND table_name IN ('audience_reaction_records','audience_reaction_aggregates')
            AND column_name ILIKE '%raw%comment%';
          """)
          print("RAW_COLS", raw)
          assert "raw_comment" not in raw.lower() or raw.strip() in ("[]","null","")
          print("SCHEMA_VERIFY_OK")
          PY
      - name: Persistence smoke + cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          def run(q):
            body = json.dumps({"query": q}).encode()
            req = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
            })
            with urllib.request.urlopen(req, timeout=60) as r:
              return r.read().decode()
          # insert smoke rows
          print(run("""
          INSERT INTO public.audience_reaction_records (
            published_post_id, published_origin, audience_evidence_status,
            reply_count_analyzed, meaningful_reply_count,
            reader_behavior_distribution, dominant_reader_behaviors,
            self_projection_evidence, story_invitation_evidence,
            participation_barrier_evidence, comprehension_barrier_evidence,
            predicted_reaction_mechanism, mechanism_validation,
            evidence_confidence, creator_origin_weight, performance_context,
            order4_version
          ) VALUES (
            'SMOKE_ORDER4_DELETE_ME', 'MANUAL_PUBLISHED', 'ANALYZED',
            2, 1,
            '{"PERSONAL_STORY":1,"AGREEMENT":1}'::jsonb, '["PERSONAL_STORY"]'::jsonb,
            '{"self_projection_strength":"WEAK"}'::jsonb, 'MODERATE',
            'LOW', 'UNKNOWN',
            'M2_EXPERIENCE_EMPATHY', 'PARTIALLY_SUPPORTED',
            0.4, 1.0, '{}'::jsonb,
            'order4_audience_reaction_v1'
          ) RETURNING id, published_post_id;
          """))
          print(run("""
          INSERT INTO public.audience_reaction_aggregates (
            aggregate_id, posts_analyzed, manual_posts_analyzed,
            reader_behavior_totals, contextual_patterns,
            contains_raw_comment_examples, order4_version, confidence
          ) VALUES (
            'SMOKE_AGG_ORDER4_DELETE_ME', 1, 1,
            '{"PERSONAL_STORY":1}'::jsonb,
            '["patterns_are_contextual_evidence_not_topic_maps"]'::jsonb,
            false, 'order4_audience_reaction_v1', 0.4
          ) RETURNING id, aggregate_id, contains_raw_comment_examples;
          """))
          # verify smoke
          v = run("SELECT published_post_id FROM public.audience_reaction_records WHERE published_post_id='SMOKE_ORDER4_DELETE_ME';")
          assert "SMOKE_ORDER4_DELETE_ME" in v
          v2 = run("SELECT contains_raw_comment_examples FROM public.audience_reaction_aggregates WHERE aggregate_id='SMOKE_AGG_ORDER4_DELETE_ME';")
          assert "false" in v2.lower()
          # cleanup
          print(run("DELETE FROM public.audience_reaction_records WHERE published_post_id='SMOKE_ORDER4_DELETE_ME';"))
          print(run("DELETE FROM public.audience_reaction_aggregates WHERE aggregate_id='SMOKE_AGG_ORDER4_DELETE_ME';"))
          left = run("SELECT count(*)::text AS c FROM public.audience_reaction_records WHERE published_post_id='SMOKE_ORDER4_DELETE_ME';")
          print("LEFT", left)
          print("SMOKE_OK_CLEANED")
          PY
