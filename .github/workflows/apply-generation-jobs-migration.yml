name: apply-generation-jobs-migration
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260814_generation_jobs_v1.sql"
      - ".github/workflows/apply-generation-jobs-migration.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply generation_jobs migration via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          SQL_FILE=supabase/migrations/20260814_generation_jobs_v1.sql
          test -f "$SQL_FILE"
          python3 - <<'PY'
          import json, os, urllib.request, ssl
          sql = open("supabase/migrations/20260814_generation_jobs_v1.sql").read()
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (compatible; AutoPostPilot/11.2.0; GitHubActions)",
              "Accept": "application/json",
          }

          def post(path, payload):
              url = f"https://api.supabase.com/v1/projects/{ref}{path}"
              body = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, text = post("/database/migrations", {"name": "generation_jobs_v1", "query": sql})
          print("MIGRATIONS_STATUS", status)
          print(text[:2000])
          if status in (200, 201, 204):
              print("APPLY_OK_MIGRATIONS")
          elif status in (400, 409) and ("already exists" in text.lower() or "duplicate" in text.lower()):
              print("APPLY_ALREADY")
          else:
              status2, text2 = post("/database/query", {"query": sql})
              print("QUERY_STATUS", status2)
              print(text2[:2000])
              if status2 not in (200, 201, 204):
                  raise SystemExit(f"apply failed migrations={status} query={status2}")
              print("APPLY_OK_QUERY")
          PY
      - name: Verify generation_jobs exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ihhiyecifxrqxfpyylpt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["PROJECT_REF"]
          q = """
          SELECT column_name
          FROM information_schema.columns
          WHERE table_schema='public' AND table_name='generation_jobs'
          ORDER BY ordinal_position;
          """
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          body = json.dumps({"query": q}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (compatible; AutoPostPilot/11.2.0; GitHubActions)",
              "Accept": "application/json",
          })
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read().decode()
              print(data)
              for need in ["id", "user_id", "status", "step", "state", "locked_at", "saved_count"]:
                  assert need in data, need
              print("TABLE_OK")
          PY
