name: order3-materialize
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/order3-parts/**"
      - "tools/order3-materialize.cjs"
    branches: [order3-thinking-rail-runtime]
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize index.ts
        run: node tools/order3-materialize.cjs
      - name: Verify markers
        run: |
          test -f supabase/functions/weekly-plan/index.ts
          test $(wc -c < supabase/functions/weekly-plan/index.ts) -ge 30000
          grep -q selectThinkingRail supabase/functions/weekly-plan/index.ts
          grep -q phased_v10_order3_thinking_rail supabase/functions/weekly-plan/index.ts
          grep -q '10.0.0-order3' supabase/functions/weekly-plan/index.ts
          grep -q guardCandidateAgainstManualLeakage supabase/functions/weekly-plan/index.ts
          grep -q interpretSeed supabase/functions/weekly-plan/index.ts
          grep -q selectReactionMechanism supabase/functions/weekly-plan/index.ts
          grep -q 'phase === "expand"' supabase/functions/weekly-plan/index.ts
          grep -q 'phase === "select"' supabase/functions/weekly-plan/index.ts
          grep -q thinking_rail supabase/functions/weekly-plan/index.ts
      - name: Run ORDER3 structural tests
        run: node tools/order3-thinking-rail-test.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ORDER3: materialize full production index.ts (selectThinkingRail + expand/select body)"
          file_pattern: supabase/functions/weekly-plan/index.ts
