name: ORDER6C materialize index
on:
  push:
    branches: [order6c-style-humor-hardened]
    paths:
      - "tools/order6c-index.patch"
      - ".github/workflows/order6c-materialize.yml"
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order6c-style-humor-hardened
      - name: Apply index patch
        run: |
          set -e
          if grep -q 'order6c_style_humor_hardened' supabase/functions/weekly-plan/index.ts; then
            echo already
          else
            patch -p1 --forward < tools/order6c-index.patch
          fi
          grep -n 'order6c\|10.0.0-order6c' supabase/functions/weekly-plan/index.ts | head
          wc -c supabase/functions/weekly-plan/index.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/weekly-plan/index.ts || true
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "ORDER6C: materialize index version/diagnostics hardening"
            git push
          fi
